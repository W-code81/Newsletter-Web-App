<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <link rel="icon" href="../../../../favicon.ico" />

    <title>Newsletter Signup</title>

    <!-- Bootstrap core CSS -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
      integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm"
      crossorigin="anonymous"
    />

    <!-- Custom styles for this template -->
    <link rel="stylesheet" href="/css/signin.css" />
  </head>

  <body class="text-center">
    <form class="form-signin" action="/" method="post" id="signUpForm">
      <img
        class="mb-4"
        src="/img/ChatGPT Image Nov 15, 2025, 12_45_02 PM.png"
        alt="company logo"
        width="72"
        height="72"
      />
      
      <h1 class="h3 mb-3 font-weight-normal">Signup to my Newsletter</h1>

      <input
        id="firstName"
        name="firstName"
        type="text"
        class="form-control top"
        placeholder="First Name"
        autofocus
      />

      <input
        id="lastName"
        name="lastName"
        type="text"
        class="form-control middle"
        placeholder="Last Name"
      />

      <input
        id="email"
        name="email"
        type="email"
        class="form-control bottom"
        placeholder="Email"
      />

      <button class="btn btn-lg btn-primary btn-block" type="submit">
        Sign up!
      </button>
      
      <p id="error-message" class="hidden"></p>

      <p class="mt-5 mb-3 text-muted">&copy; W-code81</p>
    </form>

    <script src="/JS/script.js"></script>
  </body>
</html>
