<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Success</title>

  <!-- Bootstrap CDN -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css"
  />

  <style>
    body {
      height: 100vh;
      background: linear-gradient(135deg, #4CAF50, #2E7D32);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
    }
    .card {
      padding: 40px;
      border-radius: 15px;
      text-align: center;
      background: #ffffff;
      color: #333;
      box-shadow: 0 8px 25px rgba(0,0,0,0.2);
      max-width: 420px;
    }
    .emoji {
      font-size: 60px;
      margin-bottom: 15px;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="emoji">✅</div>
    <h2 class="mb-3">You're In!</h2>
    <p>
      Your email was successfully added to our newsletter.  
      Get ready for awesome updates coming your way 🎉
    </p>
  </div>
</body>
</html>
